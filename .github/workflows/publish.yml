name: Publish to the MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) as uk.co.nopaque/totalpath.
#
# Ownership of the uk.co.nopaque namespace is proved with a DNS TXT record on
# nopaque.co.uk: "v=MCPv1; k=ed25519; p=<public key>". The matching Ed25519
# private key (hex) is the repository secret MCP_REGISTRY_PRIVATE_KEY.
# (HTTP verification is not usable: the registry does not follow redirects,
# and nopaque.co.uk 301s to www.)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in (DNS verification of nopaque.co.uk)
        env:
          PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain nopaque.co.uk --private-key "$PRIVATE_KEY"

      - name: Publish
        run: ./mcp-publisher publish
